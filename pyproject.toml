[project]
name = "ventas"
version = "1.0.0"
description = "Análisis de ventas de un e-commerce con SQL (DuckDB): limpieza, ABC, RFM, cohortes, devoluciones y canasta, con una app web que corre las consultas en el navegador."
readme = "README.md"
license = "MIT"
authors = [{ name = "Vicente Wachholtz Reyes" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "matplotlib>=3.9",
    "pyarrow>=15",
]

[project.scripts]
ventas = "ventas.analisis:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "playwright>=1.50"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]

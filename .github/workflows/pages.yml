name: Publicar Mostrador
on:
  push:
    branches: [main]
    paths: ['interfaz/**', 'sql/**', 'resultados/**', 'TERCEROS.md', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: interfaz/package-lock.json
      - run: npm ci
        working-directory: interfaz
      # DuckDB-WASM se baja de jsDelivr al abrir la página; dist/ lleva la app, las consultas y los datos (6 MB)
      - run: npm run build
        working-directory: interfaz
      - uses: actions/upload-pages-artifact@v3
        with:
          path: interfaz/dist
  publicar:
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
